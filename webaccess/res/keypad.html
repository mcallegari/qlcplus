<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>QLC+ Webaccess Keypad</title>
    <link rel="stylesheet" type="text/css" media="screen" href="common.css">
    <style>
      html {
        height: 100%;
        background-color: #222;
      }

      body {
        margin: 0px;
        background-color: #222;
      }

      td {
        width: 80px;
        height: 60px;
      }

      .button-keypad {
        display: table-cell;
        width: 80px;
        height: 60px;
        cursor: pointer;
        vertical-align: middle;
        background: #4477a1;
        border: 0;
      }

      .button-keypad:hover {
        background: #81a8cb;
      }

      .button-enter {
        display: table-cell;
        width: 320px;
        height: 60px;
        cursor: pointer;
        vertical-align: middle;
        background: #4CA145;
        border: 0;
      }

      .button-enter:hover {
        background: #81a8cb;
      }

      .button-reset {
        display: table-cell;
        width: 160px;
        height: 60px;
        cursor: pointer;
        vertical-align: middle;
        background: #c53e3e;
        border: 0;
      }

      .button-reset:hover {
        background: #cb7e7e;
      }
    </style>

    <script>
      // the WebSocket instance
      var websocket;
      var isConnected = false;

      // Keypad variables
      var chanl = [];
      var vall = [];
      var chanlvall = [];
      var channels, c, v;
      var reqchan;
      var values = [];
      // Channels set by the last command with an explicit channel spec,
      // reused by a following command that omits one (e.g. "AT ZERO"
      // after "1 THRU 8 AT 100"). Mirrors KeyPadParser::m_channels.
      var lastChannels = [];

      function connect()
      {
        var url = 'ws://' + window.location.host + '/qlcplusWS';
        websocket = new WebSocket(url);
        websocket.onopen = function() {
          isConnected = true;
        };

        websocket.onclose = function () {
          isConnected = false;
          console.log("QLC+ connection is closed. Reconnect will be attempted in 1 second.");
          setTimeout(function () {
            connect();
          }, 1000);
        };

        websocket.onerror = function () {
          console.error("QLC+ connection encountered error. Closing socket");
          websocket.close();
        };

        websocket.onmessage = function(ev) {
          //alert(ev.data);
          var msg = ev.data;
          var msgParams = ev.data.split('|');
          if (msgParams[0] === "QLC+API")
          {
            if (msgParams[1] === "getChannelsValues")
            {
              values = [];
              for (i = 2; i < msgParams.length; i+=3)
              {
                  //console.log(msgParams[i+1]);
                  values.push(msgParams[i+1]);
              }
              //console.log(values);
            }
          }
        };
      };

      window.onload = connect();

      function composeCommand(cmd)
      {
        if (isConnected === true)
        {
          var field = document.getElementById('commInput');
          var current = field.value;
          // Words (AT, THRU, FULL, ZERO, BY, +%, -%) get a space on both
          // sides so the box reads like the native app ("2 AT FULL").
          // Digits are appended with no separator so multi-digit numbers
          // (e.g. "2", "5" -> "25") keep working.
          var isWord = /^[A-Z]+$|^[+-]%$/.test(cmd);
          var needsLeadingSpace = isWord && current.length > 0 && !/\s$/.test(current);
          var trailingSpace = isWord ? ' ' : '';
          field.value = current + (needsLeadingSpace ? ' ' : '') + cmd + trailingSpace;
        }
        else
        {
          alert("You must connect to QLC+ WebSocket first!");
        }
      }

      function commandKeyDown(event)
      {
        if (event.key === 'Enter')
        {
          chans_vals(document.getElementById('commInput').value);
        }
      }


      function reqChannelsRange(univ, chan, range)
      {
        if (isConnected === true)
        {
          websocket.send("QLC+API|" + "getChannelsValues" + "|" + univ + "|" + chan + "|" + range);
        }
        else
        {
          alert("You must connect to QLC+ WebSocket first!");
        }
      }


      function resetUniverse(universeNum)
      {
        document.getElementById('commInput').value = '';
        if (isConnected === true)
        {
          websocket.send("QLC+API|sdResetUniverse|" + universeNum);
        }
        else
        {
          alert("You must connect to QLC+ WebSocket first!");
        }
      }

      function resetCh(chNum)
      {
        document.getElementById('commInput').value = '';
        if (isConnected === true)
        {
          websocket.send("QLC+API|sdResetChannel|" + chNum);
        }
        else
        {
          alert("You must connect to QLC+ WebSocket first!");
        }
      }

      // Modified set Channel Function
      function setChannel(c, v)
      {
        // This function set a channel passed with param c at value passed with param v
        if (isConnected === true)
        {
          websocket.send("CH|" + c + "|" + v);
        }
        else
        {
          alert("You must connect to QLC+ WebSocket first!");
        }
}

      function zip()
      {
        var args = [].slice.call(arguments);
        var longest = args.reduce(function(a,b)
          {
            return a.length>b.length ? a : b
          }, []);
        return longest.map(function(_,i)
          {
            return args.map(function(array){return array[i]})
          });
      }

      // Split a raw keypad command into whole-word tokens.
      // Accepts both space-separated words ("4 THRU 8 AT FULL") and the
      // compact single-letter codes produced by the on-screen buttons
      // ("4T8A255"), mirroring engine/src/keypadparser.cpp's grammar.
      function tokenize(c)
      {
        // "ENTER" is the UI's send trigger, not part of the command grammar
        // (the native app strips it the same way: it's the keypress that
        // calls parseCommand(), never a token inside the string).
        var withoutEnter = c.replace(/ENTER/g, ' ');
        var spaced = withoutEnter.replace(/AT|THRU|FULL|ZERO|BY|\+%|-%|[ATB+-]/g, ' $& ');
        return spaced.split(/\s+/).filter(function(t) { return t.length > 0; });
      }

      // Evaluate a keypad command string. This is a token-for-token port of
      // KeyPadParser::parseCommand() (engine/src/keypadparser.cpp): AT/THRU/
      // FULL/ZERO/BY are whole-word commands (also accepted as the single
      // letters A/T/B composed by the on-screen buttons), FULL and ZERO are
      // self-sufficient (any preceding AT is simply superseded), a second
      // THRU after a value defines a value range that is linearly
      // interpolated across the channel range, and a command with no
      // channel spec (e.g. "AT ZERO") reuses the channels set by the last
      // command that had one, exactly like the engine's m_channels.
      function chans_vals(c)
      {
        chanlvall = [];
        chanl = [];
        vall = [];

        var tokens = tokenize(c.toUpperCase());
        var lastCommand = 'NONE';
        var fromChannel = 0, toChannel = 0, byChannel = 1;
        var fromValue = 0, toValue = 0;
        var channelSet = false;
        var thruCount = 0;

        for (var idx = 0; idx < tokens.length; idx++)
        {
          var token = tokens[idx];

          if (token === 'AT' || token === 'A')
          {
            lastCommand = 'AT';
          }
          else if (token === 'THRU' || token === 'T')
          {
            lastCommand = 'THRU';
          }
          else if (token === 'FULL')
          {
            toValue = 255;
            lastCommand = 'FULL';
          }
          else if (token === 'ZERO')
          {
            toValue = 0;
            lastCommand = 'ZERO';
          }
          else if (token === 'BY' || token === 'B')
          {
            lastCommand = 'BY';
          }
          else if (token === '+')
          {
            lastCommand = 'PLUS';
          }
          else if (token === '-')
          {
            lastCommand = 'MINUS';
          }
          else if (token === '+%')
          {
            lastCommand = 'PLUSPERCENT';
          }
          else if (token === '-%')
          {
            lastCommand = 'MINUSPERCENT';
          }
          else
          {
            var number = parseInt(token, 10);
            if (isNaN(number))
              continue;

            switch (lastCommand)
            {
              case 'NONE':
                if (number <= 0)
                  break;
                fromChannel = number;
                toChannel = fromChannel;
                channelSet = true;
              break;
              case 'AT':
                fromValue = number;
                toValue = fromValue;
              break;
              case 'THRU':
                if (thruCount === 0)
                  toChannel = number;
                else
                  toValue = number;
                thruCount++;
              break;
              case 'FULL':
                fromValue = 255;
                toValue = 255;
              break;
              case 'ZERO':
                fromValue = 0;
                toValue = 0;
              break;
              case 'BY':
                byChannel = number;
              break;
              case 'PLUS':
              case 'MINUS':
              case 'PLUSPERCENT':
              case 'MINUSPERCENT':
                toValue = number;
              break;
            }
          }
        }

        // No channel spec in this command: reuse the last selected channels,
        // applying a flat toValue to each (matches parseCommand()'s
        // channelSet == false branch).
        if (channelSet === false)
        {
          if (lastChannels.length === 0)
            return;

          for (var i = 0; i < lastChannels.length; i++)
          {
            chanl.push(lastChannels[i]);
            vall.push(toValue);
          }
        }
        else
        {
          lastChannels = [];
          for (var ch = fromChannel; ch <= toChannel; ch += byChannel)
          {
            chanl.push(ch);
            lastChannels.push(ch);
          }

          var valueDelta = 0;
          if (toValue !== fromValue)
          {
            var chanSpan = (toChannel - fromChannel) / byChannel;
            valueDelta = (toValue - fromValue) / chanSpan;
          }

          var value = fromValue;
          for (var i = 0; i < chanl.length; i++)
          {
            var ch2 = chanl[i];
            var current = parseInt(values[ch2 - 1], 10) || 0;

            if (lastCommand === 'PLUS')
              vall.push(Math.min(255, Math.max(0, current + toValue)));
            else if (lastCommand === 'MINUS')
              vall.push(Math.min(255, Math.max(0, current - toValue)));
            else if (lastCommand === 'PLUSPERCENT')
              vall.push(Math.min(255, Math.max(0, Math.round(current * (1.0 + toValue / 100.0)))));
            else if (lastCommand === 'MINUSPERCENT')
              vall.push(Math.min(255, Math.max(0, Math.round(current - (current * (toValue / 100.0))))));
            else if (lastCommand === 'ZERO')
              vall.push(0);
            else if (lastCommand === 'FULL')
              vall.push(255);
            else
              vall.push(Math.round(value));

            value += valueDelta;
          }
        }

        chanlvall = zip(chanl, vall);
        document.getElementById('commInput').value = '';

        for (i = 0, len = chanlvall.length; i < len; i++)
        {
          c = chanlvall[i][0];
          v = chanlvall[i][1];
          setChannel(c, v);
        }
        values = [];
        reqChannelsRange(1, 1, 512);
      }
    </script>
  </head>

  <body>
    <div class="controlBar">
    <a class="button button-blue" href="/simpleDesk"><span>Back</span></a>
    <div class="swInfo">Q Light Controller Plus</div></div>
    <div style="margin: 20px 12px 0 20px; font: bold 27px/1.2em 'Trebuchet MS', Arial, Helvetica; color: #fff;">
    Command: <input style="height: 22px; vertical-align: middle;" id="commInput" type="text" value="" onkeydown="commandKeyDown(event);">
    </div>
    <table style="margin: 20px;">
      <tr>
        <td><div class="button button-keypad" onclick="composeCommand('7');">7</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('8');">8</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('9');">9</div></td>
        <td><div class="button button-keypad" title="Sets a value for a specified DMX channel or group of channels (range)" onclick="composeCommand('AT');">AT</div></td>
      </tr>
      <tr>
        <td><div class="button button-keypad" onclick="composeCommand('4');">4</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('5');">5</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('6');">6</div></td>
        <td><div class="button button-keypad" title="Selects a range of DMX channels" onclick="composeCommand('THRU');">THRU</div></td>
      </tr>
      <tr>
        <td><div class="button button-keypad" onclick="composeCommand('1');">1</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('2');">2</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('3');">3</div></td>
        <td><div class="button button-keypad" title="Sets the maximum value (255) to the selected DMX channels or group of channels" onclick="composeCommand('FULL');">FULL</div></td>
      </tr>
      <tr>
        <td><div class="button button-keypad" title="Reduces by given percentage the current channel values" onclick="composeCommand('-%');">-%</div></td>
        <td><div class="button button-keypad" onclick="composeCommand('0');">0</div></td>
        <td><div class="button button-keypad" title="Increases by given percentage the current channel values" onclick="composeCommand('+%');">+%</div></td>
        <td><div class="button button-keypad" title="Sets the minimum value (0) to the selected DMX channels or group of channels" onclick="composeCommand('ZERO');">ZERO</div></td>
      </tr>
      <tr>
        <td colspan="2">
          <div class="button button-enter" title="Send command" onclick="chans_vals(getElementById('commInput').value);">ENTER</div>
        </td>
        <td><div class="button button-keypad" style="background: gray;" title="Clears the command input field" onclick="getElementById('commInput').value = '';">CLR</div></td>
        <td><div class="button button-keypad" title="Sets a channels gap within a range" onclick="composeCommand('BY');">BY</div></td>
      </tr>
    </table>
    <br><br>
    <table style="margin: 20px;">
      <tr>
        <td style="width: 165px"><div class="button button-reset" title="Reset All Channels" onclick="resetUniverse(getElementById('commInput').value);">Reset All</div></td>
        <td style="width: 165px"><div class="button button-reset" title="Reset Selected Channel" onclick="resetCh(getElementById('commInput').value);">Reset Channel</div></td>
      </tr>
    </table>
  </body>
</html>
